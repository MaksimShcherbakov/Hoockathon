map $request_method $auth_limit_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=auth:10m rate=5r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 32k;

    location ~ ^/api/(login|register)$ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @auth_limited;
        proxy_pass http://backend:3000;
    }

    location @auth_limited {
        default_type application/json;
        charset utf-8;
        add_header Retry-After 13 always;
        add_header Cache-Control no-store always;
        return 429 '{"error":"Слишком много попыток. Повторите через 13 секунд."}';
    }

    location /api/ {
        proxy_pass http://backend:3000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
