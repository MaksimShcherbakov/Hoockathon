services:
  db:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_USER: todo
      POSTGRES_DB: todo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U todo -d todo"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks: [database]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      APP_PORT: ${APP_PORT}
      DATABASE_URL: postgresql://todo:${POSTGRES_PASSWORD}@db:5432/todo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/me').then(r => { process.exitCode = r.status === 401 ? 0 : 1 })"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks: [default, database]
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT}:80"

volumes:
  db-data:

networks:
  database:
    internal: true
